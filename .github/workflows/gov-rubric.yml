name: Governance Rubric

on:
  pull_request:
    branches: [staging]

permissions:
  contents: read

jobs:
  rubric:
    name: Governance Rubric
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.22.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      # The greater CLI is not published to the npm registry; it ships as a
      # release asset. Pinned to the same release the vendored tree came from so
      # SEC-7 checks the tree against its own CLI. Without this step SEC-7 is
      # BLOCKED and the report does not pass.
      - name: Install pinned greater CLI
        run: npm install --no-save --prefix gov-infra/.tools https://github.com/equaltoai/greater-components/releases/download/greater-v0.11.9/greater-components-cli.tgz
      - name: Run governance rubric
        run: bash gov-infra/verifiers/gov-verify-rubric.sh
      - name: Upload governance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gov-rubric-evidence
          path: gov-infra/evidence/
