name: Test

on:
  pull_request:
    branches: [staging]

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.22.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Build first: the SSR probes drive build/server/handler.mjs and the
      # uncompiled-rune guard walks build/, where an absent build passes
      # vacuously. `pnpm test` alone is not evidence on a clean checkout.
      - run: pnpm run build
      # The CON-4 release-binding tests drive the real verifier, which
      # re-derives vendored bytes from the digest-verified greater CLI release
      # asset. That asset is not on the npm registry and is not committed; this
      # step verifies its SHA-256 against the repo contract and leaves the
      # tarball on disk, the same warm-up the governance workflow runs.
      - run: node gov-infra/verifiers/install-greater-cli.mjs
      - run: pnpm test
